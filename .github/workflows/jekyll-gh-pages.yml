name: Refresh and deploy Auction Watch

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. This runs at 8:10 AM Chicago time during CDT.
    - cron: "10 13 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh validated public catalogs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run refresh

      - name: Lint, test, and build static site
        run: |
          npm run lint
          npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Vite production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
